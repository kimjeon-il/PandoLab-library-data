# Storage-only transfer. ALL GIS derivation and validation happen in Pando.
# This workflow does not run a generator, map analysis, or tests.
name: Ingest audited Hydro metadata package into storage

on:
  push:
    branches: [main]
    paths:
      - 'reports/geography/osm-hydro-name-replacement-2026-10-24/runtime-publish-request.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: storage-hydro-import
  cancel-in-progress: true

jobs:
  store-audited-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /archive/index.json
            /assets/data/hydro/v0.13.2/*
            /reports/geography/osm-hydro-name-replacement-2026-10-24/runtime-publish-request.json
      - name: Download audited artifact from Pando (no source generation here)
        uses: actions/download-artifact@v4
        with:
          name: gis-osm-hydro-inventory
          repository: kimjeon-il/Pando
          run-id: 40055943255
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-hydro
      - name: Copy exact audited files and synchronize archive storage pointers
        env:
          VERIFIED_ROOT: ${{ runner.temp }}/verified-hydro/hydro-independent-five
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ["VERIFIED_ROOT"])
          target=pathlib.Path("assets/data/hydro/v0.13.2")
          req=json.loads(pathlib.Path("reports/geography/osm-hydro-name-replacement-2026-10-24/runtime-publish-request.json").read_text())
          assert req["auditRun"] == 40055943255
          assert req["auditCommit"] == "2101634a267085d566c92ef2219b07ad0435604b"
          assert req["targetBundleSha256"] == "aee3368aa05543050fb4455265d2192c2322d2a0506c88f9f9a61f1f1158daf4"
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          proof=json.loads((root/"proof.json").read_text())
          new_manifest=json.loads((root/"manifest.json").read_text())
          old_manifest=json.loads((target/"manifest.json").read_text())
          original=old_manifest["container"]["sha256"]
          assert original in (proof["beforeBundleSha256"], proof["afterBundleSha256"])
          assert proof["changedCoreFragments"] == 1895
          assert proof["remainingOsmMatchedSystems"] == 31
          assert proof["renamedSystemCount"] == 8
          assert len(proof["changedSystemIds"]) == 42
          assert proof["originalIndexSha256"] == proof["newIndexSha256"]
          assert proof["originalGeometryShardsSha256"] == proof["newGeometryShardsSha256"]
          assert sha(root/"hydro.bin") == req["targetBundleSha256"] == new_manifest["container"]["sha256"]
          assert sha(root/"hydro-independent-name-replacements.json") == new_manifest["sources"]["independentHydronymReplacements"]["sha256"]
          assert sorted(proof["changedSystemIds"]) == sorted(r["systemId"] for r in json.loads((root/"hydro-independent-name-replacements.json").read_text())["replacements"])
          indexpath=pathlib.Path("archive/index.json")
          index=json.loads(indexpath.read_text())
          for filename in ("hydro.bin", "manifest.json", "hydro-independent-name-replacements.json"):
              source=root/filename
              dest=target/filename
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(source.read_bytes())
              logical=str(dest)
              index["files"][logical]={
                  "stored":logical, "encoding":"identity",
                  "sha256":sha(dest), "bytes":dest.stat().st_size,
              }
          index["sourceRevision"]=req["auditCommit"]
          indexpath.write_text(json.dumps(index,ensure_ascii=False,separators=(",",":"))+"\n")
          print("Stored three audited Hydro files; verified 42 systems, 31 remaining; geometry unchanged")
          PY
      - name: Commit only archived files and validated metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- archive/index.json assets/data/hydro/v0.13.2/hydro.bin assets/data/hydro/v0.13.2/manifest.json assets/data/hydro/v0.13.2/hydro-independent-name-replacements.json
          if git diff --cached --quiet; then
            echo "Already stored. No changes."
          else
            git diff --cached --check
            git commit -m 'data(hydro): store 42 independently verified river-name source replacements'
            git push origin HEAD:main
          fi
